<text x="22" y="78" xml:space="preserve" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12.5"><tspan fill="#C084FC">const </tspan><tspan fill="#FDE68A">satayesh</tspan><tspan fill="#94A3B8"> = {</tspan></text><text x="22" y="102" xml:space="preserve" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12.5"><tspan fill="#7C9CFF">  role</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#5EEAD4">&quot;Frontend Developer&quot;</tspan><tspan fill="#94A3B8">,</tspan></text><text x="22" y="126" xml:space="preserve" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12.5"><tspan fill="#7C9CFF">  stack</tspan><tspan fill="#94A3B8">: [</tspan><tspan fill="#5EEAD4">&quot;React&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#5EEAD4">&quot;Next.js&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#5EEAD4">&quot;Angular&quot;</tspan><tspan fill="#94A3B8">],</tspan></text><text x="22" y="150" xml:space="preserve" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12.5"><tspan fill="#7C9CFF">  tests</tspan><tspan fill="#94A3B8">: [</tspan><tspan fill="#5EEAD4">&quot;Jest&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#5EEAD4">&quot;Jasmine&quot;</tspan><tspan fill="#94A3B8">],</tspan></text><text x="22" y="174" xml:space="preserve" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12.5"><tspan fill="#7C9CFF">  openTo</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#5EEAD4">&quot;collaboration&quot;</tspan><tspan fill="#94A3B8">,</tspan></text><text x="22" y="198" xml:space="preserve" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12.5"><tspan fill="#94A3B8">};</tspan></text><rect x="42" y="190" width="7" height="15" fill="#7C